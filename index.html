<canvas id="game" width="350" height="450"></canvas>
<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let playerX = 150;
  let blocks = [];      // NEW: list of falling blocks
  let score = 0;        // NEW
  let gameOver = false; // NEW

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") playerX -= 20;
    if (e.key === "ArrowRight") playerX += 20;
    if (e.key === " " && gameOver) location.reload(); // NEW: space = restart
  });

  function draw() {
    if (gameOver) {                          // NEW
      ctx.fillStyle = "black";
      ctx.font = "30px sans-serif";
      ctx.fillText("GAME OVER", 85, 200);
      ctx.fillText("Score: " + score, 110, 240);
      return;
    }

    ctx.fillStyle = "skyblue";
    ctx.fillRect(0, 0, 350, 450);

    ctx.fillStyle = "green";
    ctx.fillRect(playerX, 400, 40, 40);

    // NEW: sometimes spawn a block at a random spot
    if (Math.random() < 0.03) {
      blocks.push({ x: Math.random() * 320, y: 0 });
    }

    // NEW: move + draw each block, check if it hits you
    ctx.fillStyle = "brown";
    for (const b of blocks) {
      b.y += 4;
      ctx.fillRect(b.x, b.y, 30, 30);
      if (b.y + 30 > 400 && b.y < 440 && b.x + 30 > playerX && b.x < playerX + 40) {
        gameOver = true;
      }
    }

    score++;                                  // NEW
    ctx.fillStyle = "black";
    ctx.font = "20px sans-serif";
    ctx.fillText("Score: " + score, 10, 25);

    requestAnimationFrame(draw);
  }

  draw();
</script>
